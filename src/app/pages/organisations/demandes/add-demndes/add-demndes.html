
<div class="page">



  <div class="entete">

    <div>
      <h1>Créer une demande d'aide</h1>

      <p>
        Enregistrez une nouvelle demande d'aide pour un bénéficiaire.
      </p>
    </div>

  </div>


  

  <form
    class="formulaire"
    [formGroup]="formulaire"
    (ngSubmit)="creerDemande()"
  >


    <!-- INFORMATIONS DE LA DEMANDE -->

    <div class="section">

      <h2>Informations de la demande</h2>


      <div class="ligne">

        <!-- BENEFICIAIRE -->

        <div class="champ">

          <label for="beneficiaire">
            Bénéficiaire
          </label>

          <select
            id="beneficiaire"
            formControlName="beneficiaireId"
          >

            <option [ngValue]="null">
              Sélectionner un bénéficiaire
            </option>

            <option
              *ngFor="let beneficiaire of beneficiaires"
              [ngValue]="beneficiaire.id"
            >
              {{ beneficiaire.prenom }}
              {{ beneficiaire.nom }}
            </option>

          </select>

        </div>


        <!-- CATEGORIE -->

        <div class="champ">

          <label for="categorie">
            Catégorie
          </label>

          <select
            id="categorie"
            formControlName="categorieDemandeId"
          >

            <option [ngValue]="null">
              Sélectionner une catégorie
            </option>

            <option
              *ngFor="let categorie of categories"
              [ngValue]="categorie.id"
            >
              {{ categorie.nom }}
            </option>

          </select>

        </div>

      </div>


      <div class="ligne">

        <!-- TYPE -->

        <div class="champ">

          <label for="typeDemande">
            Type de demande
          </label>

          <select
            id="typeDemande"
            formControlName="typeDemande"
          >

            <option value="">
              Sélectionner un type
            </option>

            <option value="INDIVIDUEL">
              Individuelle
            </option>

            <option value="COLLECTIF">
              Collective
            </option>

          </select>

        </div>


        <!-- TITRE -->

        <div class="champ">

          <label for="titre">
            Titre de la demande
          </label>

          <input
            id="titre"
            type="text"
            formControlName="titre"
            placeholder="Ex : Besoin de fournitures scolaires"
          >

        </div>

      </div>

    </div>


    <!-- SITUATION -->

    <div class="section">

      <h2>Situation du bénéficiaire</h2>


      <div class="ligne">

        <!-- NOMBRE DE PERSONNES -->

        <div class="champ">

          <label for="nombrePersonne">
            Nombre de personnes
          </label>

          <input
            id="nombrePersonne"
            type="number"
            min="1"
            formControlName="nombrePersonne"
            placeholder="Ex : 5"
          >

        </div>


        <!-- URGENCE -->

        <div class="champ">

          <label for="niveauUrgence">
            Niveau d'urgence
          </label>

          <select
            id="niveauUrgence"
            formControlName="niveauUrgence"
          >

            <option value="">
              Sélectionner un niveau
            </option>

            <option value="FORTE">
              Élevée
            </option>

            <option value="MOYENNE">
              Moyenne
            </option>

            <option value="FAIBLE">
              Faible
            </option>

          </select>

        </div>

      </div>


      <!-- DESCRIPTION -->

      <div class="champ">

        <label for="descriptionSituation">
          Description de la situation
        </label>

        <textarea
          id="descriptionSituation"
          formControlName="descriptionSituation"
          rows="5"
          placeholder="Décrivez la situation et le besoin du bénéficiaire..."
        ></textarea>

      </div>

    </div>


    <!-- BESOIN FINANCIER -->

    <div class="section">

      <h2>Besoin financier</h2>


      <div class="champ montant">

        <label for="montantNecessaire">
          Montant nécessaire (FCFA)
        </label>

        <input
          id="montantNecessaire"
          type="number"
          min="1"
          formControlName="montantNecessaire"
          placeholder="Ex : 250000"
        >

      </div>

    </div>
    <div class="section">

  <h2>Justificatifs</h2>

  <div class="ligne">

    <div class="champ">

      <label for="typeJustificatif">
        Type de justificatif
      </label>

      <select
        id="typeJustificatif"
        formControlName="typeJustificatifId"
      >

        <option [ngValue]="null">
          Sélectionner un type
        </option>

        <option
          *ngFor="let type of typesJustificatifs"
          [ngValue]="type.id"
        >
          {{ type.nom }}
        </option>

      </select>

    </div>

    <div class="champ">

      <label for="fichiers">
        Fichiers justificatifs
      </label>

      <input
        id="fichiers"
        type="file"
        multiple
        (change)="selectionnerFichiers($event)"
      >

    </div>

  </div>

 <div class="fichiers-selectionnes">

  <label>
    Fichiers sélectionnés
  </label>

  <p *ngIf="fichiers.length === 0">
    Aucun fichier sélectionné
  </p>

  <div
    class="fichier"
    *ngFor="let fichier of fichiers; let i = index"
  >

    <span>
      {{ fichier.name }}
    </span>

  <button
  type="button"
  class="supprimer-fichier"
  (click)="supprimerFichier(i)"
  title="Supprimer"
>
  <mat-icon>delete</mat-icon>
</button>

  </div>

</div>

</div>


    <!-- BOUTONS -->

    <div class="boutons">

      <button
        type="button"
        class="annuler"
        (click)="annuler()"
      >
        Annuler
      </button>

      <button
        type="submit"
        class="creer"
      >
        Créer la demande
      </button>

    </div>

  </form>

</div>
