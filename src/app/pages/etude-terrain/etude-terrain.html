<div class="container mt-4">
  <h2>Étude de Terrain</h2>
  <form (ngSubmit)="enregistre()">
    <div class="mb-3">
      <label>Lieu</label>
      <input type="text" class="form-control" [(ngModel)]="etude.lieu" name="lieu">
    </div>
    <div class="mb-3">
      <label>Objectif</label>
      <input type="text" class="form-control" [(ngModel)]="etude.objectif" name="objectif">
    </div>
    <div class="mb-3">
      <label>Observation</label>
      <textarea class="form-control" [(ngModel)]="etude.observation" name="observation"></textarea>
    </div>
    <div class="mb-3">
      <label>Résultat</label>
      <select class="form-control" [(ngModel)]="etude.resultat" name="resultat">
        <option value="En attente">En attente</option>
        <option value="Planifier">Planifier</option>
        <option value="Terminer">Terminer</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <button type="button" class="btn btn-secondary ms-2" (click)="modifier()">Modifier</button>
  </form>
</div>
