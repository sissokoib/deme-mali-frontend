<div class="sidebar-inner">

  <div class="sidebar-head">

    <a
      class="brand"
      routerLink="/admin/dashboard"
      aria-label="Dèmè Mali">

      <span class="brand-mark">
        <img
          src="assets/img/LOGO.png"
          alt="Logo Dèmè Mali"
          class="logos-image">
      </span>

      <span class="brand-text">
        <span class="brand-name">Dèmè Mali</span>
      </span>

    </a>

    <!-- Bouton fermer sur petit écran uniquement -->
    <button
      type="button"
      class="sidebar-close d-lg-none"
      aria-label="Fermer le menu"
      (click)="fermerSidebar()">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M18 6 6 18"/>
        <path d="M6 6l12 12"/>

      </svg>

    </button>

  </div>

  <nav class="sidebar-nav" aria-label="Navigation administration">

    <!-- VUE D'ENSEMBLE -->
    <p class="nav-heading">VUE D'ENSEMBLE</p>

    <ul class="nav-list">

      <li>
        <a
          class="nav-item-link"
          routerLink="/admin/dashboard"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>

          </svg>

          <span class="nav-label">Tableau de bord</span>
        </a>
      </li>

    </ul>

    <!-- GESTION -->
    <p class="nav-heading">GESTION</p>

    <ul class="nav-list">

      <!-- Dons -->
      <li>
        <a
          class="nav-item-link"
          routerLink="/admin/dons"
          routerLinkActive="is-active">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>

          </svg>

          <span class="nav-label">Dons</span>
        </a>
      </li>

      <!-- Rapports -->
      <li>
        <a
          class="nav-item-link"
          routerLink="/admin/rapports"
          routerLinkActive="is-active">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <line x1="9" y1="20" x2="9" y2="13"/>
            <line x1="15" y1="20" x2="15" y2="6"/>

          </svg>

          <span class="nav-label">Rapports</span>
        </a>
      </li>

      <!-- Membres -->
      <li>
        <a
          class="nav-item-link"
          routerLink="/admin/membres"
          routerLinkActive="is-active">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>

          </svg>

          <span class="nav-label">Membres</span>
        </a>
      </li>

      <!-- Partenaires -->
      <li>
        <a
          class="nav-item-link"
          routerLink="/admin/partenaires"
          routerLinkActive="is-active">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>

          </svg>

          <span class="nav-label">Partenaires</span>
        </a>
      </li>

    </ul>

    <!-- COMPTE -->
    <p class="nav-heading">COMPTE</p>

    <ul class="nav-list">

      <li>
        <button
          type="button"
          class="nav-item-link nav-logout"
          (click)="logout()">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>

          </svg>

          <span class="nav-label">Se déconnecter</span>
        </button>
      </li>

    </ul>

  </nav>

</div>
