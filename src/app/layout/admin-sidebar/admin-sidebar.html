<div class="sidebar-inner">

  <div class="sidebar-head">

    <a
      class="brand"
      routerLink="/admin/dashboard"
      aria-label="Dèmè Mali">

      <span class="brand-mark">
        <img
          src="assets/img/LOGO.png"
          alt="Logo Dèmè Mali"
          class="logos-image">
      </span>

      <span class="brand-text">
        <span class="brand-name">Dèmè Mali</span>
      </span>

    </a>

    <!-- Bouton fermer sur petit écran uniquement -->
    <button
      type="button"
      class="sidebar-close d-lg-none"
      aria-label="Fermer le menu"
      (click)="fermerSidebar()">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M18 6 6 18"/>
        <path d="M6 6l12 12"/>

      </svg>

    </button>

  </div>

  <nav class="sidebar-nav" aria-label="Navigation administration">

    <!-- VUE D'ENSEMBLE -->
    <p class="nav-heading">VUE D'ENSEMBLE</p>

    <ul class="nav-list">

      <li>
        <a
          class="nav-item-link"
          routerLink="/admin/dashboard"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>

          </svg>

          <span class="nav-label">Tableau de bord</span>
        </a>
      </li>

    </ul>

    <!-- GESTION -->
    <p class="nav-heading">GESTION</p>

    <ul class="nav-list">

      <!-- Dons reçus -->
      <li>
        <a
          class="nav-item-link"
          routerLink="/admin/dons"
          routerLinkActive="is-active">

          <mat-icon>card_giftcard</mat-icon>
          <span class="nav-label">Dons reçus</span>
        </a>
      </li>

      <!-- Attribution des dons -->
      <li>
        <a
          class="nav-item-link"
          routerLink="/admin/affectations-dons"
          routerLinkActive="is-active">

          <mat-icon>assignment_ind</mat-icon>
          <span class="nav-label">Attribution des dons</span>
        </a>
      </li>

      <!-- Rapports -->
      <li>
        <a
          class="nav-item-link"
          routerLink="/admin/rapports"
          routerLinkActive="is-active">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <line x1="10" y1="9" x2="8" y2="9"/>
          </svg>

          <span class="nav-label">Rapports</span>
        </a>
      </li>

      <!-- Membres (Bénéficiaires & Organisations Partenaires) -->
      <li>
        <a
          class="nav-item-link"
          routerLink="/admin/membres"
          routerLinkActive="is-active">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>

          </svg>

          <span class="nav-label">Membres</span>
        </a>
      </li>

      <!-- Donateurs -->
      <li>
        <a
          class="nav-item-link"
          routerLink="/admin/donateurs"
          routerLinkActive="is-active">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>

          </svg>

          <span class="nav-label">Donateurs</span>
        </a>
      </li>

      <!-- Fin de la liste de gestion -->
    </ul>

    <!-- COMPTE -->
    <p class="nav-heading">COMPTE</p>

    <ul class="nav-list">

      <li>
        <button
          type="button"
          class="nav-item-link nav-logout"
          (click)="logout()">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>

          </svg>

          <span class="nav-label">Se déconnecter</span>
        </button>
      </li>

    </ul>

  </nav>

</div>
