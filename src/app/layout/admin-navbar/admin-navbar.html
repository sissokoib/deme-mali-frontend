<header class="topbar">
  <div class="search-container">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" class="search-input" placeholder="Rechercher un projet...">
  </div>

  <div class="topbar-right">
    <button class="notif-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notif-badge">1</span>
    </button>

    <div class="user-profile">
      <img src="assets/img/user-avatar.png" alt="Sissoko Ibrahima" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Sissoko+Ibrahima&background=random'">
      <div class="user-info">
        <span class="user-name">Sissoko Ibrahima</span>
        <span class="user-role">PDG</span>
      </div>
      <svg class="user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </div>
</header>
