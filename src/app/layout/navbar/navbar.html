<header class="topbar">

  <button
    type="button"
    class="icon-btn d-lg-none"
    aria-label="Ouvrir le menu"
    (click)="ouvrirSidebar()"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <button
    type="button"
    class="icon-btn d-none d-lg-inline-flex"
    id="sidebarCollapse"
    aria-controls="sidebar"
    aria-expanded="true"
    aria-label="Toggle sidebar"
    title="Collapse or expand the sidebar"
    (click)="toggleSidebarCollapse()"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M9 3v18"/>
      <path d="m15 10-2 2 2 2"/>
    </svg>
  </button>

  <div class="topbar-actions">

    <span class="topbar-date">
      {{ obtenirDate() }}
    </span>

    <div class="dropdown">

      @if (currentUser$ | async; as user) {

        <button
          type="button"
          class="user-btn"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          aria-label="Account menu"
        >

          <span
            class="avatar av-2"
            aria-hidden="true"
          >
            {{ obtenirInitiales(user.prenom, user.nom) }}
          </span>

          <span class="user-text">

            <span class="user-name">
              {{ user.prenom }} {{ user.nom }}
            </span>

            <span class="user-role">
              {{ user.typeOrganisation }}
            </span>

          </span>

        </button>

        <!-- <ul class="dropdown-menu dropdown-menu-end user-menu">
          <li class="user-menu-head">
            <span
              class="avatar av-2 avatar-lg"
              aria-hidden="true"
            >
              {{ obtenirInitiales(user.prenom, user.nom) }}
            </span>

            <span>
              <span class="user-name">
                {{ user.prenom }} {{ user.nom }}
              </span>

              <span class="user-role">
                {{ user.typeOrganisation }}
              </span>
            </span>
          </li>
        </ul> -->

      }

    </div>

  </div>

</header>
